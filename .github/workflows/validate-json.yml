name: Validate Gates JSON

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate All JSON Files
        run: |
          for f in $(find apps -name "*.json"); do
            echo "Validating $f..."
            jq . "$f" > /dev/null || (echo "❌ Error parsing JSON in $f" && exit 1)
          done
          echo "✅ All app gate JSON files parsed successfully!"
